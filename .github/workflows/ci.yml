name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f index.html
          test -f css/styles.css
          test -f css/widgets.css
          test -f js/engine.js
          test -f js/engine-advanced.js
          test -f js/ui.js
          test -f js/app.js
          test -f README.md
          echo "All required files present"

      - name: Validate HTML shell
        run: |
          grep -q 'id="app"' index.html
          grep -q 'id="board"' index.html
          grep -q 'SC Whiteboard' index.html
          grep -q 'engine-advanced.js' index.html
          grep -q 'widgets.css' index.html
          grep -q 'btn-curtain' index.html
          grep -q 'btn-timer' index.html
          echo "HTML structure OK"

      - name: Syntax-check JavaScript
        run: |
          node --check js/engine.js
          node --check js/engine-advanced.js
          node --check js/ui.js
          node --check js/app.js
          echo "JS syntax OK"

      - name: Feature markers
        run: |
          grep -q 'deletePage' js/engine-advanced.js
          grep -q 'insertTextAt' js/engine-advanced.js
          grep -q 'btn-curtain' js/ui.js
          grep -q 'PERIODIC' js/ui.js
          grep -q '\.curtain' css/widgets.css
          echo "Feature markers OK"
