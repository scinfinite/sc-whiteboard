<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <title>SC Whiteboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app" class="app" data-theme="dark">
    <header class="topbar glass">
      <div class="brand">
        <div class="logo" aria-hidden="true">SC</div>
        <div class="brand-text">
          <strong>SC Whiteboard</strong>
          <span class="muted">Advanced teaching canvas</span>
        </div>
      </div>
      <div class="top-actions">
        <button type="button" class="btn ghost" id="btn-undo" title="Undo (Ctrl+Z)" aria-label="Undo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"/><path d="M3 13a9 9 0 1 0 3-7.7L3 7"/></svg>
        </button>
        <button type="button" class="btn ghost" id="btn-redo" title="Redo" aria-label="Redo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6"/><path d="M21 13a9 9 0 1 1-3-7.7L21 7"/></svg>
        </button>
        <div class="divider"></div>
        <button type="button" class="btn ghost" id="btn-export" title="Export PNG">PNG</button>
        <button type="button" class="btn ghost" id="btn-export-json" title="Export project JSON">JSON</button>
        <button type="button" class="btn ghost" id="btn-theme" title="Toggle theme">Theme</button>
        <button type="button" class="btn primary" id="btn-fullscreen" title="Fullscreen (F)">Present</button>
      </div>
    </header>

    <aside class="toolbar glass" id="toolbar" aria-label="Drawing tools">
      <div class="tool-group">
        <button type="button" class="tool active" data-tool="select" title="Select (V)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4l7 16 2-7 7-2L4 4z"/></svg>
        </button>
        <button type="button" class="tool" data-tool="pen" title="Pen (P)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        </button>
        <button type="button" class="tool" data-tool="brush" title="Soft brush">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.06 11.9l8.07-8.06a2.85 2.85 0 1 1 4.03 4.03l-8.06 8.08"/><path d="M7.07 14.94c-1.66 0-3 1.35-3 3.02 0 1.33-2.5 1.52-2 2.02 1.08 1.1 2.49 2.02 4 2.02 2.2 0 4-1.8 4-4.04a3.01 3.01 0 0 0-3-3.02z"/></svg>
        </button>
        <button type="button" class="tool" data-tool="highlighter" title="Highlighter (H)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l-6 6v3h3l6-6"/><path d="M16 4l4 4-8 8-4-4 8-8z"/></svg>
        </button>
        <button type="button" class="tool" data-tool="eraser" title="Eraser (E)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13L11 6l-7 7 7 7 7-7z"/><path d="M7.5 13.5L13 19"/></svg>
        </button>
        <button type="button" class="tool" data-tool="laser" title="Laser">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
        </button>
      </div>

      <div class="tool-group">
        <button type="button" class="tool" data-tool="line" title="Line">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 19L19 5"/></svg>
        </button>
        <button type="button" class="tool" data-tool="rect" title="Rectangle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="5" width="16" height="14" rx="1"/></svg>
        </button>
        <button type="button" class="tool" data-tool="ellipse" title="Ellipse">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="12" rx="8" ry="6"/></svg>
        </button>
        <button type="button" class="tool" data-tool="triangle" title="Triangle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5L4 19h16L12 5z"/></svg>
        </button>
        <button type="button" class="tool" data-tool="arrow" title="Arrow">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
        </button>
      </div>

      <div class="tool-group">
        <button type="button" class="tool" data-tool="text" title="Text">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V5h16v2"/><path d="M12 5v14"/><path d="M8 19h8"/></svg>
        </button>
        <button type="button" class="tool" data-tool="sticky" title="Sticky">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>
        </button>
        <button type="button" class="tool" id="btn-image" title="Image">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-4 4-2-2-5 5"/></svg>
        </button>
      </div>

      <div class="tool-group props">
        <label class="swatch-label">Color
          <input type="color" id="color-picker" value="#3b82f6" />
        </label>
        <div class="presets" id="color-presets">
          <button type="button" data-c="#0f172a" style="background:#0f172a"></button>
          <button type="button" data-c="#ef4444" style="background:#ef4444"></button>
          <button type="button" data-c="#f59e0b" style="background:#f59e0b"></button>
          <button type="button" data-c="#22c55e" style="background:#22c55e"></button>
          <button type="button" data-c="#3b82f6" style="background:#3b82f6"></button>
          <button type="button" data-c="#a855f7" style="background:#a855f7"></button>
          <button type="button" data-c="#ffffff" style="background:#fff;border:1px solid #64748b"></button>
        </div>
        <label class="range-label">Size
          <input type="range" id="size-slider" min="1" max="48" value="4" />
        </label>
        <label class="range-label">Opacity
          <input type="range" id="opacity-slider" min="10" max="100" value="100" />
        </label>
        <label class="check-label">
          <input type="checkbox" id="fill-toggle" /> Fill shapes
        </label>
      </div>
    </aside>

    <main class="stage" id="stage">
      <canvas id="board" aria-label="Whiteboard canvas"></canvas>
      <div id="laser-dot" class="laser-dot" hidden></div>
      <div id="spotlight" class="spotlight" hidden></div>
      <div id="curtain" class="curtain" hidden>
        <div class="curtain-bar" id="curtain-bar"></div>
      </div>
      <div id="magnifier" class="magnifier" hidden></div>
      <div id="timer-widget" class="timer-widget glass" hidden>
        <div class="timer-display" id="timer-display">05:00</div>
        <div class="timer-actions">
          <button type="button" class="btn small" id="timer-start">Start</button>
          <button type="button" class="btn small ghost" id="timer-reset">Reset</button>
          <button type="button" class="btn small ghost" id="timer-close">×</button>
        </div>
      </div>
      <div id="clock-widget" class="clock-widget glass" hidden>
        <span id="clock-display">00:00:00</span>
        <button type="button" class="btn small ghost" id="clock-close">×</button>
      </div>
    </main>

    <aside class="sidepanel glass" id="sidepanel">
      <section class="panel-section">
        <h3>Pages</h3>
        <div class="page-list" id="page-list"></div>
        <div class="page-actions">
          <button type="button" class="btn small" id="btn-add-page">+ Page</button>
          <button type="button" class="btn small ghost" id="btn-dup-page">Dup</button>
          <button type="button" class="btn small ghost" id="btn-del-page">Del</button>
        </div>
      </section>

      <section class="panel-section">
        <h3>Background</h3>
        <div class="bg-grid" id="bg-grid">
          <button type="button" class="bg-swatch" data-bg="plain" title="Plain"></button>
          <button type="button" class="bg-swatch" data-bg="grid" title="Grid"></button>
          <button type="button" class="bg-swatch" data-bg="ruled" title="Ruled"></button>
          <button type="button" class="bg-swatch" data-bg="dots" title="Dots"></button>
          <button type="button" class="bg-swatch" data-bg="dark" title="Dark"></button>
          <button type="button" class="bg-swatch" data-bg="gradient" title="Gradient"></button>
        </div>
      </section>

      <section class="panel-section">
        <h3>Teaching</h3>
        <button type="button" class="btn small block" id="btn-spotlight">Spotlight</button>
        <button type="button" class="btn small block" id="btn-curtain">Screen curtain</button>
        <button type="button" class="btn small block" id="btn-magnifier">Magnifier</button>
        <button type="button" class="btn small block" id="btn-timer">Timer</button>
        <button type="button" class="btn small block ghost" id="btn-clock">Clock</button>
        <button type="button" class="btn small block ghost" id="btn-clear">Clear page</button>
      </section>

      <section class="panel-section">
        <h3>Subjects</h3>
        <div class="subject-tabs">
          <button type="button" class="btn small" data-subject="chem">Chem</button>
          <button type="button" class="btn small" data-subject="math">Math</button>
          <button type="button" class="btn small" data-subject="phys">Phys</button>
          <button type="button" class="btn small" data-subject="eng">Eng</button>
        </div>
        <div id="subject-panel" class="subject-panel"></div>
      </section>

      <section class="panel-section tips">
        <h3>Tips</h3>
        <p class="muted small">Space+drag pan · Wheel zoom · Shift shapes · T timer · C curtain</p>
      </section>
    </aside>

    <footer class="statusbar glass">
      <span id="status-tool">Select</span>
      <span id="status-zoom">100%</span>
      <span id="status-page">Page 1 / 1</span>
    </footer>

    <input type="file" id="file-image" accept="image/*" hidden />
  </div>

  <script src="js/engine.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
